name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Let us manually trigger a re-run from the Actions tab
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Don't cancel all shards when one fails -- we want to see
      # e.g. a Windows-only Unicode bug without losing Ubuntu results.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,llama-cpp]"

      - name: Run pytest
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Recognition quality gate (precision/recall/F1 vs golden dataset)
        # Defends the recognition thesis as a number: a commit that regresses
        # recognition quality below the golden-dataset bar fails here, visibly,
        # rather than slipping through. Latency p95 is held to a generous 5ms
        # ceiling (the substrate is ~tens of microseconds; this only catches a
        # pathological regression, not normal CI-runner noise).
        # shell: bash so the backslash line-continuation parses on Windows too
        # (default Windows shell is PowerShell, which does not understand `\`).
        shell: bash
        run: |
          python -m cli.main recognition eval --summary \
            --min-micro-f1 1.0 --min-macro-f1 1.0 --max-p95-us 5000

      - name: Federation leak audit (credential + visibility leaks)
        # Library-wide guarantee that no published L5 manifest leaks a credential
        # or a private-tagged entity. Points at a committed clean reference
        # library so the auditor always scans a real manifest (the default
        # ~/agent-library is empty on a CI runner). --strict fails on any finding;
        # --require-files fails if zero manifests were scanned, so a future
        # path/rename regression can't turn this gate back into a trivial pass.
        shell: bash
        run: |
          python -m cli.main audit-leaks --summary --strict --require-files \
            --library tests/fixtures/leak_audit_library

      - name: Run smoke test (orchestrator against bundled example data)
        working-directory: core
        run: |
          python orchestrator.py

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint
        # v0.0.x is pre-alpha; lint warnings are reported but don't fail the build
        # until the codebase stabilizes. Tighten to `ruff check --exit-non-zero`
        # once there's a coherent lint baseline to hold to.
        run: |
          ruff check . || echo "::warning::ruff reported issues (non-fatal in v0.0.x)"
      - name: Conformance drift gate (parity fixtures match the oracle)
        # The TS mirror asserts against conformance/*. Regenerate from the live
        # Python oracle and fail if a committed fixture changed but wasn't
        # re-committed -- this is what stops the two implementations drifting.
        # Stdlib-only (core.redaction), so no package install needed.
        run: |
          python tools/gen_conformance.py
          git diff --exit-code -- conformance/ \
            || { echo "::error::conformance fixtures are stale -- run 'python tools/gen_conformance.py' and commit"; exit 1; }
